[application]
geng = "0.6.0 <= v < 0.7.0"
runtime = "node"
source-directories = ["src"]

[dependencies]
"github.com/gilramir/gren-diff" = "1.0.0 <= v < 2.0.0"
"github.com/geng-language/node" = "6.1.3 <= v < 7.0.0"
"github.com/geng-language/test" = "5.0.0 <= v < 6.0.0"
"github.com/geng-language/test-runner-node" = "7.0.0 <= v < 8.0.0"

[sources]
"github.com/gilramir/gren-diff" = { path = ".." }
"github.com/geng-language/node" = { path = "../../../gren-lang/node" }
"github.com/geng-language/test" = { path = "../../../gren-lang/test" }
"github.com/geng-language/test-runner-node" = { path = "../../../gren-lang/test-runner-node" }
"github.com/geng-language/stream" = { path = "../../../../packages/stream" }
"github.com/geng-language/url" = { path = "../../../../packages/url" }
